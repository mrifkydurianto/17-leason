<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifky Reika</title>
    <style>
        body {
            height: 3000px;
            font-family: arial;
        }

        .Kotak-Abu {
            position: fixed;
            background-color: grey;
            width: 320px;
            height: 180px;
            bottom: 20px;
            right: 20px;
        }

         .X-Button { 
            position: absolute;
            background-color: black;
            color: white;
            top: -17px;
            left: -17px;
            height: 47px;
            width: 47px;
            border-radius: 25px;
            font-size: 22px;
            font-family: arial;
            align-items: center;
            justify-content: center;
            display: flex;
        }
        .time {
      position: absolute;
      background-color: black;
      color: white;
      padding: 5px 7px 5px 7px;
      bottom: 10px;
      right: 10px;
      font-size: 10px;
    }
    </style>
</head>

<body>
    <div class="Kotak-Abu">
        <div class="X-Button">X</div>
        <div class="time">09:05</div>
    </div>
</body>

</html>
