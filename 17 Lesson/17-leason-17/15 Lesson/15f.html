<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rifky Reika</title>
    <style>
        body {
            height: 3000px;
            font-family: arial;
        }

        .product-container {
            position: relative;
            display: inline-block;
        }

        .product-image {
            width: 500px;
            display: block;
            object-fit: cover;
        }

        .discount-label {
            position: absolute;
            top: 10px;
            right: 0;
            background-color: black;
            color: white;
            padding: 8px 12px;
            font-family: Arial;
            font-size: 14px;
        }

        .Kotak_transparan {
            position: absolute;
            bottom: 0;
            right: 0;
            left: 0;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tombol-button {
            background-color: white;
            border: 1px solid black;
            font-size: 10px;
            padding: 7px 18px;

            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="product-container">
        <img src="Kemeja2.jpeg" alt="Kemeja 2">
        <div class="discount-label">20% OFF</div>
        <div class="Kotak_transparan">
            <div class="tombol-button"> Add to Cart </div>
        </div>
    </div>
</body>

</html>
