<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rifky Reika</title>
  <style>
    .container{
      display: grid;
      grid-template-columns: 50px 200px 75px;
    }
    .grid1{
      background-color: #7fbfff;
    }
    .grid2{
      background-color: pink;
    }
    .grid3{
      background-color: #7fbfff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="grid1">col1</div>
    <div class="grid2">col2</div>
    <div class="grid3">col3</div>
  </div>
</body>
</html>
