<!DOCTYPE html>
<html>
<head>
<title>Rifky Reika</title>

<style>
body{
  font-family:Arial;
}

.box{
  height:40px;
  background:#5c5858;
  border-radius:10px;
  display:flex;
  align-items:center;
}

button{
  margin:5px;
  border:0;
  color:white;
  background:#353535;
}

.v{
  background:#494949;
  border-radius:10px;
}

.tab{
  height:40px;
  background:#494949;
  display:flex;
  align-items:center;
  border-radius:10px 10px 0 0;
  padding:5px;
}

.tab img{
  width:25px;
}

.tab a{
  color:white;
  text-decoration:none;
  margin-left:5px;
}

.plus{
  width:30px;
  height:30px;
  border-radius:50%;
}

.info{
  position:absolute;
  top:50px;
  background:#202225;
  color:white;
  padding:10px;
  border-radius:10px;
  opacity:0;
}

.tab:hover .info{
  opacity:1;
}
</style>

</head>

<body>

<div class="box">

<button class="v">v</button>

<div class="tab">

<img src="RIFKY.jpg" alt="Rifky Reika">

<a href="#">Rifky Reika</a>

<button>x</button>

<div class="info">
Rifky Reika<br>
127.0.0.1:5500
</div>

</div>

<button class="plus">+</button>

</div>

</body>
</html>
