<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>13c - Nested Layout</title>
  <style>
    body {
      margin: 30px;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
    }

    .email-card {
      width: 360px;
      padding: 14px;
      background-color: white;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.25);
    }

    .email-row {
      display: flex;
      flex-direction: row;
      align-items: center;
    }

    .avatar {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 50%;
      margin-right: 10px;
    }

    .email-content {
      flex: 1;
      display: block;
    }

    .email-header {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }

    .sender {
      margin: 0;
      font-weight: bold;
      font-size: 14px;
    }

    .time {
      color: gray;
      font-size: 11px;
    }

    .subject {
      display: block;
      font-weight: bold;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .message {
      display: block;
      color: gray;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="email-card">
    <div class="email-row">
      <img class="avatar" src="RIFKY.jpg" alt="Profile picture">

      <div class="email-content">
        <div class="email-header">
          <p class="sender">Chewy Promotions</p>
          <span class="time">4:58 PM</span>
        </div>

        <span class="subject">Biggest sales of the year!</span>
        <span class="message">Hey there! We're writing to tell you about our...</span>
      </div>
    </div>
  </div>
</body>
</html>
